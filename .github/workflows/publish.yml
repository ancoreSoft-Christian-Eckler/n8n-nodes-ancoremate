# Publishes n8n-nodes-ancoremate to npm with provenance, which n8n requires for verified community nodes.
# Copied to .github/workflows/publish.yml of the public repository by tools/n8n/sync_public_repo.py; runs only there
# (public repository, no Actions minutes) when a version tag such as 1.16.0 is pushed.
# npm accepts the run through Trusted Publishing (package settings on npmjs.com > Trusted Publisher > GitHub Actions,
# workflow publish.yml); no token is stored.
name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check version
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run lint

      - run: npm publish --provenance --access public
